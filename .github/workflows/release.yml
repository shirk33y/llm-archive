name: Release

on:
  push:
    tags: [v*]

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev
      - run: uv run ruff check
      - run: uv run pytest -q --cov-fail-under=70

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev
      - run: uv run pytest -q -m "e2e and not brew" -x --tb=short -s

  brew:
    needs: [tests, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: homebrew/actions/setup-homebrew@master
      - run: |
          brew tap shirk33y/llm-archive
          brew install llm-archive --HEAD
          llm-archive --help
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev
      - name: Setup systemd user session (Linux)
        run: |
          sudo loginctl enable-linger "$USER"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          systemctl --user daemon-reload || true
      - env:
          CI: "1"
        run: uv run pytest -q -m brew -x --tb=short -s
      - name: Teardown
        if: always()
        run: |
          brew services stop llm-archive 2>/dev/null || true
          brew services cleanup 2>/dev/null || true

  publish:
    needs: [tests, e2e, brew]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes