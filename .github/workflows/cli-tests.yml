name: CLI Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  service:
    name: service e2e (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install package
        run: uv sync --extra dev

      - name: Run scheduler e2e
        env:
          TEST_HOME: ${{ runner.temp }}/home
        run: scripts/e2e-service.sh

      - name: Teardown
        if: always()
        run: |
          [ -f "$RUNNER_TEMP/svc.pid" ] && kill "$(cat "$RUNNER_TEMP/svc.pid")" 2>/dev/null || true
          echo '--- service log ---'
          cat "$RUNNER_TEMP/svc.log" 2>/dev/null || true

  brew:
    name: brew + brew services (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Homebrew
        uses: homebrew/actions/setup-homebrew@master

      - name: Install via brew
        run: |
          brew tap shirk33y/llm-archive
          brew install llm-archive --HEAD
          llm-archive --help

      - name: Brew e2e
        run: scripts/e2e-brew.sh

      - name: Teardown
        if: always()
        run: |
          brew services stop llm-archive 2>/dev/null || true
          brew services cleanup 2>/dev/null || true