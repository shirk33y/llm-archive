name: CLI Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  service:
    name: service e2e (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev
      - run: uv run pytest -q -m "e2e and not brew" -x --tb=short -s

  brew:
    name: brew + brew services (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Homebrew
        uses: homebrew/actions/setup-homebrew@master

      - name: Install via brew
        run: |
          git config --global user.email "ci@github.com"
          git config --global user.name "CI"
          brew tap-new shirk33y/local
          ln -sf $PWD/Formula/llm-archive.rb "$(brew --repository shirk33y/local)/Formula/"
          brew install --HEAD shirk33y/local/llm-archive 2>&1 || echo "brew install completed (non-fatal warnings)"
          command -v llm-archive && llm-archive --help

      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra dev

      - name: Setup systemd user session (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$USER"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          systemctl --user daemon-reload || true

      - env:
          CI: "1"
        run: uv run pytest -q -m brew -x --tb=short -s

      - name: Teardown
        if: always()
        run: |
          brew services stop llm-archive 2>/dev/null || true
          brew services cleanup 2>/dev/null || true