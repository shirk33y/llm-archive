name: Brew Install
on: [push, pull_request]
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: homebrew/actions/setup-homebrew@master
      - run: |
          git config --global user.email "ci@github.com"
          git config --global user.name "CI"
          brew tap-new shirk33y/local
          ln -sf $PWD/Formula/llm-archive.rb "$(brew --repository shirk33y/local)/Formula/"
          brew install --HEAD shirk33y/local/llm-archive 2>&1 || echo "brew install completed (non-fatal warnings)"
          command -v llm-archive
      - run: llm-archive --help
      - run: llm-archive status --json | jq -e '.sources | map(.id) | index("dummy") | not'