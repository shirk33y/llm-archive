[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-archive"
version = "0.5.0"
description = "Dump and sync AI conversations from multiple sources into a local SQLite database"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "httpx>=0.27",
    "rich>=13.0",
    "websocket-client>=1.7",
    "protobuf>=7.34.1",
    "psutil>=5.9",
    "websockets>=16.0",
    "textual>=0.50",
    "mcp>=0.6.0",
    "sqlite-vec>=0.1.9",
    "yt-dlp>=2025.12.8",
    "watchdog>=6.0.0",
    "fastembed>=0.8.0",
    "litellm>=1.83.0,<1.83.3",
    "pydantic>=2.13.3",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=3.7",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.scripts]
llm-archive = "llm_archive.cli:main"

[tool.coverage.run]
source = ["llm_archive"]
omit = ["*/tests/*", "*/__main__.py", "llm_archive/tui.py", "llm_archive/ingestors/windsurf.py", "llm_archive/mcp_server.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.hatch.build.targets.wheel]
packages = ["llm_archive"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "e2e: end-to-end tests (service/brew infrastructure required)",
    "brew: brew-specific e2e tests (requires Homebrew)",
]
addopts = "-m 'not e2e'"
